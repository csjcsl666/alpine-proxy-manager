name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  diag:
    name: tinyproxy 诊断 ${{ matrix.os }} ${{ matrix.aa }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        aa: [unconfined, default]
    steps:
      - uses: actions/checkout@v4
      - name: 主机信息
        run: |
          . /etc/os-release; echo "$PRETTY_NAME kernel $(uname -r)"; docker version --format '{{.Server.Version}}'
          sudo aa-status 2>&1 | head -3
          sudo aa-status 2>&1 | grep -i tinyproxy || echo "aa-status: 没有 tinyproxy 配置"
          ls /etc/apparmor.d | grep -i tinyproxy || echo "/etc/apparmor.d: 没有 tinyproxy 文件"
          for f in /etc/apparmor.d/*tinyproxy*; do [ -f "$f" ] && { echo "== $f"; grep -vE '^\s*#|^\s*$' "$f" | head -40; }; done
          dpkg -S /etc/apparmor.d 2>/dev/null | head -2
      - name: 容器内最小复现
        run: |
          if [ "${{ matrix.aa }}" = unconfined ]; then SO="--security-opt apparmor=unconfined"; else SO=; fi
          docker run --rm --cap-add SYS_PTRACE --cap-add SYS_ADMIN --cap-add NET_ADMIN --security-opt seccomp=unconfined $SO -v "$PWD:/src:ro" alpine:3.24 sh /src/tests/e2e/diag-tinyproxy.sh
      - name: 主机内核拒绝记录
        if: always()
        run: sudo dmesg 2>/dev/null | grep -iE 'apparmor="(DENIED|ALLOWED)"' | grep -i tinyproxy | tail -8 || true

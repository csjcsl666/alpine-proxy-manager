name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpine:
    name: Alpine ${{ matrix.alpine }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        alpine: ["3.21", "3.22", "3.24"]
    steps:
      - uses: actions/checkout@v4
      - name: 在 Alpine 容器内检查并测试
        run: docker run --rm -v "$PWD:/src:ro" "alpine:${{ matrix.alpine }}" sh /src/tests/ci-alpine.sh

  snell-official:
    name: 官方 Snell release smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 下载官方 Snell 并运行 -v
        run: docker run --rm -v "$PWD:/src:ro" alpine:3.24 sh /src/tests/official-snell-smoke.sh

  singbox-official:
    name: 官方 sing-box release smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 下载官方 sing-box 并执行 check 与短时间运行
        run: docker run --rm -v "$PWD:/src:ro" alpine:3.24 sh /src/tests/official-singbox-smoke.sh

      - name: 同一份四协议配置在 v1.14.2 上的兼容性
        run: docker run --rm -v "$PWD:/src:ro" alpine:3.24 sh /src/tests/official-singbox-smoke.sh 1.14.2

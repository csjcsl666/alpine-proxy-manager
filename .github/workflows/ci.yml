name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpine:
    name: Alpine ${{ matrix.alpine }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        alpine: ["3.21", "3.22", "3.24"]
    steps:
      - uses: actions/checkout@v4
      - name: 在 Alpine 容器内检查并测试
        run: docker run --rm -v "$PWD:/src:ro" "alpine:${{ matrix.alpine }}" sh /src/tests/ci-alpine.sh

  snell-net-e2e:
    name: Snell 网络功能端到端 (真实 Snell v6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # ubuntu-26.04 起宿主机 apparmor 自带 tinyproxy 配置 (附加到 /usr/bin/tinyproxy, 只允许读 /etc/tinyproxy/tinyproxy.conf)
      # 下面的容器用 apparmor=unconfined 运行, 执行容器内同一路径的 Alpine tinyproxy 时会切换到这个宿主机配置,
      # 读取 /run/apm-snell/tinyproxy.conf 被拒绝 (内核审计 apparmor="DENIED" profile="tinyproxy" operation="open")
      # 只卸载这一个配置, AppArmor 本身保持开启; 卸载后核对确实不在内核里, 否则直接失败
      - name: 卸载宿主机按路径附加到 tinyproxy 的 AppArmor 配置
        run: |
          P=/sys/kernel/security/apparmor/profiles
          if sudo grep -q '^tinyproxy ' "$P" 2>/dev/null; then
            sudo apparmor_parser -R /etc/apparmor.d/tinyproxy
            if sudo grep -q '^tinyproxy ' "$P"; then echo "tinyproxy 配置仍在内核里" >&2; exit 1; fi
            echo "已卸载宿主机 AppArmor 配置 tinyproxy"
          else
            echo "宿主机没有加载 tinyproxy 配置, 无需处理"
          fi
      - name: 构建补丁版 graftcp, 安装官方 Snell v6, 运行端到端测试
        run: >
          docker run --rm --cap-add SYS_PTRACE --cap-add SYS_ADMIN --cap-add NET_ADMIN
          --security-opt seccomp=unconfined --security-opt apparmor=unconfined
          -v "$PWD:/src:ro" alpine:3.24 sh /src/tests/e2e/ci-net.sh

  snell-official:
    name: 官方 Snell release smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 下载官方 Snell 并运行 -v
        run: docker run --rm -v "$PWD:/src:ro" alpine:3.24 sh /src/tests/official-snell-smoke.sh

  singbox-official:
    name: 官方 sing-box release smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 下载官方 sing-box 并执行 check 与短时间运行
        run: docker run --rm -v "$PWD:/src:ro" alpine:3.24 sh /src/tests/official-singbox-smoke.sh

      - name: 同一份四协议配置在 v1.14.2 上的兼容性
        run: docker run --rm -v "$PWD:/src:ro" alpine:3.24 sh /src/tests/official-singbox-smoke.sh 1.14.2
      - name: 目标访问限制真实流量测试 v1.13.14
        run: docker run --rm -v "$PWD:/src:ro" alpine:3.24 sh /src/tests/official-singbox-relay-smoke.sh 1.13.14
      - name: 目标访问限制真实流量测试 v1.14.2
        run: docker run --rm -v "$PWD:/src:ro" alpine:3.24 sh /src/tests/official-singbox-relay-smoke.sh 1.14.2
      - name: Server SOCKS Egress 真实流量测试 v1.13.14
        run: docker run --rm -v "$PWD:/src:ro" alpine:3.24 sh /src/tests/official-singbox-egress-smoke.sh 1.13.14
      - name: Server SOCKS Egress 真实流量测试 v1.14.2
        run: docker run --rm -v "$PWD:/src:ro" alpine:3.24 sh /src/tests/official-singbox-egress-smoke.sh 1.14.2
      - name: SOCKS 出口真实流量矩阵 v1.13.14 (本机 内网 IPv6 主机名 TCP UDP DNS 故障)
        run: docker run --rm --cap-add NET_ADMIN -v "$PWD:/src:ro" alpine:3.24 sh /src/tests/official-singbox-socks-matrix-smoke.sh 1.13.14
      - name: SOCKS 出口真实流量矩阵 v1.14.2
        run: docker run --rm --cap-add NET_ADMIN -v "$PWD:/src:ro" alpine:3.24 sh /src/tests/official-singbox-socks-matrix-smoke.sh 1.14.2
      - name: Client Export 真实客户端流量测试 v1.13.14
        run: docker run --rm -v "$PWD:/src:ro" alpine:3.24 sh /src/tests/official-singbox-client-smoke.sh 1.13.14
      - name: Client Export 真实客户端流量测试 v1.14.2
        run: docker run --rm -v "$PWD:/src:ro" alpine:3.24 sh /src/tests/official-singbox-client-smoke.sh 1.14.2
